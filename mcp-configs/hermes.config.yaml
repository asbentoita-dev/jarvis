# agent-browser para Hermes Agent (Nous Research)
# Destino: ~/.hermes/config.yaml  (no Windows: C:\Users\<user>\AppData\Local\hermes\config.yaml)
# Alternativa automática: hermes mcp add agent-browser --command "C:\...\agent-browser.cmd" --connect-timeout 60 --args mcp

mcp_servers:
  agent-browser:
    command: C:\Users\Casa\AppData\Roaming\npm\agent-browser.cmd
    args:
      - mcp
    connect_timeout: 60.0
    enabled: true
  selenium:
    command: C:\Python314\python.exe
    args:
      - C:\Users\Casa\mcp-servers\selenium_mcp.py
    connect_timeout: 60.0
    enabled: true
  pyautogui:
    command: C:\Python314\python.exe
    args:
      - C:\Users\Casa\mcp-servers\pyautogui_mcp.py
    connect_timeout: 60.0
    enabled: true
